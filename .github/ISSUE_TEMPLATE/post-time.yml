name: POST time report
description: "One boot of one machine, as the machine recorded it."
title: "[post-time] "
labels: ["report", "census:post-time"]
body:
  - type: markdown
    attributes:
      value: |
        Build the report on the census page: https://techfuelhq.com/data/post-time-census/

        It reads the output of one command and writes the block below. Nothing has to be written by hand.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: The block the census page wrote. Paste it as it is.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you send
      options:
        - label: This is my own hardware, and I took this reading myself.
          required: true
        - label: I release this report under CC BY 4.0.
          required: true
