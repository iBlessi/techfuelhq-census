name: Drive arrival report
description: "One hard drive, read with smartctl on the day it arrived."
title: "[drive-arrival] "
labels: ["report", "census:drive-arrival"]
body:
  - type: markdown
    attributes:
      value: |
        Build the report on the census page: https://techfuelhq.com/data/drive-arrival-census/

        It reads what smartctl printed, leaves the serial number out, and writes the block below. Nothing has to be written by hand.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: The block the census page wrote. Paste it as it is.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you send
      options:
        - label: This is my own hardware, and I took this reading myself.
          required: true
        - label: I release this report under CC BY 4.0.
          required: true
