name: 12V-2x6 pin current report
description: "One connector on one card, read under one load."
title: "[pin-current] "
labels: ["report", "census:pin-current"]
body:
  - type: markdown
    attributes:
      value: |
        Build the report on the census page: https://techfuelhq.com/data/pin-current-census/

        It reads a log, or six numbers from any tool that shows each pin, and writes the block below. Nothing has to be written by hand.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: The block the census page wrote. Paste it as it is.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you send
      options:
        - label: This is my own hardware, and I took this reading myself.
          required: true
        - label: I release this report under CC BY 4.0.
          required: true
