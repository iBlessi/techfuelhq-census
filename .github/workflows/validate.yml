name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Prove the checks catch what they claim to
        run: npm test
      - name: Validate every dataset
        run: npm run validate
      - name: Schemas, summaries and field tables match the definitions and the data
        run: |
          node scripts/schemas.mjs --check
          node scripts/summary.mjs --check
          node scripts/docs.mjs --check
